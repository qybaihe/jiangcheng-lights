<!doctype html><html><style>html,body{margin:0;background:#e8e3d6}canvas{display:block}.label{position:absolute;top:0;font:20px serif;left:20px}</style><div class="label"></div><script type="module">
import * as T from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {VRMLoaderPlugin,VRMUtils} from '@pixiv/three-vrm';
const r=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});r.setSize(innerWidth,innerHeight);r.setPixelRatio(1.5);r.outputColorSpace=T.SRGBColorSpace;r.toneMapping=T.ACESFilmicToneMapping;document.body.append(r.domElement);const scene=new T.Scene();scene.background=new T.Color('#e7e3d7');scene.add(new T.HemisphereLight('#eef5fb','#7c8879',2));const light=new T.DirectionalLight('#fff5e7',2.2);light.position.set(3,6,5);scene.add(light);const cam=new T.PerspectiveCamera(28,innerWidth/innerHeight,.1,100);cam.position.set(0,1.04,4.65);cam.lookAt(0,.98,0);const name=new URLSearchParams(location.search).get('model')||'granny';document.querySelector('.label').textContent=name;const loader=new GLTFLoader();loader.register(parser=>new VRMLoaderPlugin(parser));const gltf=await loader.loadAsync('/models/residents/'+name+'.vrm');const vrm=gltf.userData.vrm;VRMUtils.rotateVRM0(vrm);scene.add(vrm.scene);for(const side of ['left','right']){const b=vrm.humanoid.getNormalizedBoneNode(side+'UpperArm');b.rotation.z=(side==='left'?1:-1)*1.16;}vrm.scene.updateMatrixWorld(true);vrm.update(.016);const heights={granny:1.52,chef:1.62,dock:1.73,community:1.67,walker0:1.65,walker1:1.72,walker2:1.66,walker3:1.64,walker4:1.8};const widths={granny:1.06,chef:1.10,dock:1.08,community:.97,walker0:1.04,walker1:1.05,walker2:1,walker3:.96,walker4:1.02};const box=new T.Box3().setFromObject(vrm.scene);const scale=heights[name]/(box.max.y-box.min.y);vrm.scene.scale.set(scale*(widths[name]||1),scale,scale);vrm.scene.position.y=-box.min.y*scale;vrm.update(.016);r.render(scene,cam);window.__VRM__=vrm;window.__READY__=true;
