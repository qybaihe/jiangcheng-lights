<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>旧照实景取样 · 独立美术制作场景</title><style>*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden}canvas{width:100%;height:100%;display:block}#status{position:fixed;inset:0;display:grid;place-items:center;background:#e8e9d1;font:20px serif;color:#466756}#status[hidden]{display:none}</style></head><body><canvas id="world" tabindex="0"></canvas><div id="status">正在展开晴川里的实景…</div><script type="module">
import {World} from '/src/world.js';
import {PHOTO_CHALLENGES,samplePhotoWorld,evaluatePhotoAlignment} from '/src/photo-alignment.js';
const id=new URL(location.href).searchParams.get('photo')||'shop', c=PHOTO_CHALLENGES[id];
const w=new World(document.querySelector('canvas')); window.photoAuthoring={world:w,id,challenge:c};
await w.heroReady; await w.residentAvatarsReady;
w.start();w.reduced=true;w.eyeHeight=c.reference.eyeHeight;w.setPosition(c.reference);w.setCameraMode('first');w.firstYaw=c.reference.yaw;w.firstPitch=c.reference.pitch;w.syncFirstPersonCamera();w.curvedWorld.update();
const inspect=()=>{const sample=samplePhotoWorld(w,id);return {id,canWalk:w.canWalk(c.reference.x,c.reference.z),height:w.heightAt(c.reference.x,c.reference.z),sample,assessment:evaluatePhotoAlignment(id,sample)};};
window.photoAuthoring.inspect=inspect;
await new Promise(resolve=>setTimeout(resolve,1500)); document.querySelector('#status').hidden=true;document.documentElement.dataset.ready='true';
</script></body></html>
